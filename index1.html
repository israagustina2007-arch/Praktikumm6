<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Javascript</title>
</head>
<body>
    <h2>Praktikum Basic Javascript</h2>
    <p>Lihat Hasil Melalui Console (f12)</p>

    <script>
        const nama = "Isra cantik";
        let umur = 18;
        let nilai = 100;
        let aktif = true;

        console.log("Nama:", nama);
        console.log("Umur:", umur);
        console.log("Nilai:", nilai);
        console.log("Aktif:", aktif);
        console.log("Type nilai:", typeof nilai);

        const tugas = 80;
        const uts = 75;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai akhir:", akhir);
        console.log("Lulus:", akhir >= 60);

        const skor = 78;
        let kategori;

        if (skor >= 85) {
            kategori = "A";
        } else if (skor >= 70) {
            kategori = "B";
        } else if (skor >= 60) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("Skor:", skor);
        console.log("Kategori:", kategori);

        function hitungDiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 1; i <= 3; i++) {
            const harga = i * 10000;
            const bayar = hitungDiskon(harga, 10);
            console.log("Barang", i, "Harga:", harga, "Bayar:", bayar);
        }
    </script>
</body>
</html>
